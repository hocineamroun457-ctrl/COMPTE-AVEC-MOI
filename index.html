<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compte avec moi !</title>
<style>
  :root { --bg:#fff7e0; --card:#ffffff; --main:#ff7a00; --ok:#2ecc71; --ko:#e74c3c; }
  body.theme-ocean { --bg:#dff3ff; --main:#0b7bd1; }
  body.theme-nuit  { --bg:#1e1b4b; --card:#312e81; --main:#fbbf24; color:#fff; }
  body.theme-foret { --bg:#e3f6e1; --main:#2f8f3a; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Comic Sans MS","Trebuchet MS",sans-serif; background:var(--bg); color:#333; text-align:center; transition:background .3s; }
  body.theme-nuit { color:#fff; }
  header { display:flex; justify-content:space-around; padding:12px; background:var(--main); color:#fff; font-size:1.2rem; font-weight:bold; }
  main { max-width:560px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border-radius:20px; padding:20px; box-shadow:0 4px 12px rgba(0,0,0,.15); margin-bottom:16px; }
  #items { font-size:2.4rem; min-height:120px; line-height:1.4; word-break:break-all; }
  .answers { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
  button { font:inherit; font-size:1.8rem; padding:16px; border:none; border-radius:16px; background:var(--main); color:#fff; cursor:pointer; box-shadow:0 4px 0 rgba(0,0,0,.25); }
  button:active { transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.25); }
  button.ok { background:var(--ok); } button.ko { background:var(--ko); }
  button.small { font-size:1rem; padding:8px 14px; }
  button:disabled { background:#aaa; cursor:not-allowed; }
  #msg { font-size:1.4rem; min-height:2em; font-weight:bold; }
  .tabs { display:flex; gap:8px; justify-content:center; margin-bottom:12px; }
  .shop-item { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:10px 0; border-bottom:1px solid rgba(0,0,0,.1); text-align:left; }
  .shop-item span.e { font-size:2rem; }
  .hidden { display:none; }
  small { opacity:.7; }
</style>
</head>
<body>
<header>
  <div>⭐ Score : <span id="score">0</span></div>
  <div>🔥 Série : <span id="streak">0</span></div>
  <div>🪙 Pièces : <span id="coins">0</span></div>
</header>
<main>
  <div class="tabs">
    <button class="small" onclick="show('game')">🎮 Jouer</button>
    <button class="small" onclick="show('shop')">🛒 Boutique</button>
    <button class="small" id="btnMusique" onclick="basculerMusique()">🎵 Musique</button>
  </div>

  <section id="game">
    <div class="card">
      <p>Combien y en a-t-il ?</p>
      <div id="items"></div>
    </div>
    <div class="answers" id="answers"></div>
    <p id="msg"></p>
    <small>Niveau <span id="level">1</span> — chaque bonne réponse donne des pièces 🪙</small>
  </section>

  <section id="shop" class="hidden">
    <div class="card">
      <h2>🛒 Boutique</h2>
      <p>Dépense tes pièces pour débloquer des surprises !</p>
      <div id="shopList"></div>
    </div>
    <button class="small" onclick="resetAll()" style="background:#888">♻️ Tout recommencer</button>
  </section>
</main>

<script>
// ---------- Données de la boutique (prix en pièces virtuelles) ----------
const SHOP = [
  { id:"emoji-animaux", nom:"Pack Animaux", emoji:"🐶", prix:20, type:"pack", items:["🐶","🐱","🐰","🐻","🐼","🦊","🐸","🐵"] },
  { id:"emoji-fruits",  nom:"Pack Fruits",  emoji:"🍎", prix:20, type:"pack", items:["🍎","🍌","🍓","🍇","🍒","🍊","🍉","🍍"] },
  { id:"emoji-espace",  nom:"Pack Espace",  emoji:"🚀", prix:40, type:"pack", items:["🚀","⭐","🌙","🪐","👽","☄️","🛸","🌍"] },
  { id:"emoji-dragons", nom:"Pack Dragons", emoji:"🐲", prix:60, type:"pack", items:["🐲","🐉","🔥","🥚","🛡️","⚔️","👑","💎"] },
  { id:"theme-ocean",   nom:"Thème Océan",  emoji:"🌊", prix:30, type:"theme", theme:"theme-ocean" },
  { id:"theme-foret",   nom:"Thème Forêt",  emoji:"🌳", prix:30, type:"theme", theme:"theme-foret" },
  { id:"theme-nuit",    nom:"Thème Nuit",   emoji:"🌙", prix:50, type:"theme", theme:"theme-nuit" },
  { id:"bonus-double",  nom:"Pièces x2",    emoji:"💰", prix:100, type:"bonus" }
];
const DEFAUT = ["🍪","⭐","🎈","🧸","🚗","🌼","🍭","🎲"];

// ---------- État sauvegardé dans le navigateur ----------
let etat = JSON.parse(localStorage.getItem("compter-etat") || "null") || {
  score:0, coins:0, streak:0, achetes:[], pack:null, theme:null
};
const save = () => localStorage.setItem("compter-etat", JSON.stringify(etat));
const $ = id => document.getElementById(id);

let bonne = 0, bloque = false;

function niveau() { return Math.min(1 + Math.floor(etat.score / 10), 10); }
function maxNombre() { return Math.min(3 + niveau() * 2, 20); }

function majEntete() {
  $("score").textContent = etat.score;
  $("streak").textContent = etat.streak;
  $("coins").textContent = etat.coins;
  $("level").textContent = niveau();
  document.body.className = etat.theme || "";
}

function nouvelleQuestion() {
  bloque = false;
  $("msg").textContent = "";
  const max = maxNombre();
  bonne = 1 + Math.floor(Math.random() * max);
  const pack = SHOP.find(s => s.id === etat.pack);
  const liste = pack ? pack.items : DEFAUT;
  const symbole = liste[Math.floor(Math.random() * liste.length)];
  $("items").textContent = symbole.repeat(bonne);

  // 4 réponses possibles, dont la bonne
  const choix = new Set([bonne]);
  while (choix.size < 4) {
    const c = Math.max(1, bonne + Math.floor(Math.random() * 7) - 3);
    choix.add(c);
  }
  const melange = [...choix].sort(() => Math.random() - 0.5);
  $("answers").innerHTML = "";
  melange.forEach(n => {
    const b = document.createElement("button");
    b.textContent = n;
    b.onclick = () => repondre(n, b);
    $("answers").appendChild(b);
  });
}

function repondre(n, bouton) {
  if (bloque) return;
  if (n === bonne) {
    bloque = true;
    bouton.classList.add("ok");
    etat.score++; etat.streak++;
    let gain = 1 + (etat.streak % 5 === 0 ? 3 : 0); // bonus tous les 5 d'affilée
    if (etat.achetes.includes("bonus-double")) gain *= 2;
    etat.coins += gain;
    $("msg").textContent = "Bravo ! +" + gain + " 🪙";
    sonBon();
    save(); majEntete();
    setTimeout(nouvelleQuestion, 1000);
  } else {
    bouton.classList.add("ko");
    bouton.disabled = true;
    etat.streak = 0;
    $("msg").textContent = "Essaie encore ! Compte avec ton doigt 👆";
    sonMauvais();
    save(); majEntete();
  }
}

// ---------- Boutique ----------
function show(page) {
  $("game").classList.toggle("hidden", page !== "game");
  $("shop").classList.toggle("hidden", page !== "shop");
  if (page === "shop") dessinerBoutique();
}

function dessinerBoutique() {
  const liste = $("shopList");
  liste.innerHTML = "";
  SHOP.forEach(art => {
    const possede = etat.achetes.includes(art.id);
    const actif = etat.pack === art.id || etat.theme === art.theme;
    const div = document.createElement("div");
    div.className = "shop-item";
    div.innerHTML = `<span class="e">${art.emoji}</span><span style="flex:1">${art.nom}<br><small>${possede ? "Débloqué ✅" : art.prix + " 🪙"}</small></span>`;
    const b = document.createElement("button");
    b.className = "small";
    if (!possede) {
      b.textContent = "Acheter";
      b.disabled = etat.coins < art.prix;
      b.onclick = () => acheter(art);
    } else if (art.type === "bonus") {
      b.textContent = "Actif"; b.disabled = true;
    } else {
      b.textContent = actif ? "Utilisé" : "Utiliser";
      b.disabled = actif;
      b.onclick = () => equiper(art);
    }
    div.appendChild(b);
    liste.appendChild(div);
  });
}

function acheter(art) {
  if (etat.coins < art.prix) return;
  etat.coins -= art.prix;
  etat.achetes.push(art.id);
  sonAchat();
  equiper(art);
}

function equiper(art) {
  if (art.type === "pack") etat.pack = art.id;
  if (art.type === "theme") etat.theme = art.theme;
  save(); majEntete(); dessinerBoutique(); nouvelleQuestion();
}

function resetAll() {
  if (confirm("Effacer tout ta progression ?")) {
    localStorage.removeItem("compter-etat");
    location.reload();
  }
}

// ---------- Musique et sons (créés par le navigateur, aucun fichier à ajouter) ----------
let ac = null, boucle = null, noteIdx = 0;
let musiqueOn = localStorage.getItem("compter-musique") !== "off";
const MELODIE = [523.25,587.33,659.25,783.99,659.25,587.33,523.25,392.00,
                 440.00,493.88,523.25,659.25,523.25,493.88,440.00,392.00];

function audio() {
  if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
  if (ac.state === "suspended") ac.resume();
  return ac;
}
function note(freq, dur, type, vol, delai) {
  const a = audio(), o = a.createOscillator(), g = a.createGain();
  const t = a.currentTime + (delai || 0);
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t + dur + 0.05);
}
function demarrerMusique() {
  if (!musiqueOn || boucle) return;
  boucle = setInterval(() => {
    const f = MELODIE[noteIdx % MELODIE.length];
    note(f, 0.4, "triangle", 0.06);
    if (noteIdx % 4 === 0) note(f / 2, 1.2, "sine", 0.05);
    noteIdx++;
  }, 450);
}
function arreterMusique() { clearInterval(boucle); boucle = null; }
function basculerMusique() {
  musiqueOn = !musiqueOn;
  localStorage.setItem("compter-musique", musiqueOn ? "on" : "off");
  musiqueOn ? demarrerMusique() : arreterMusique();
  majBoutonMusique();
}
function majBoutonMusique() {
  $("btnMusique").textContent = musiqueOn ? "🎵 Musique : OUI" : "🔇 Musique : NON";
}
function sonBon()    { [523, 659, 784].forEach((f, i) => note(f, 0.25, "sine", 0.15, i * 0.1)); }
function sonMauvais(){ note(220, 0.3, "sawtooth", 0.07); }
function sonAchat()  { [784, 988, 1319].forEach((f, i) => note(f, 0.2, "square", 0.06, i * 0.08)); }

// Les navigateurs exigent un clic avant de jouer du son
document.addEventListener("click", demarrerMusique, { once: true });

majBoutonMusique();
majEntete();
nouvelleQuestion();
</script>
</body>
</html>
